repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-yaml
        name: check yaml (mkdocs)
        files: ^mkdocs\.yml$
        args: [--unsafe]
        additional_dependencies: [pymdown-extensions]
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]
exclude: "generated/.*|artifacts/.*"
