services:
  concierge:
    container_name: concierge
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "http.server", "8000"]
    env_file:
      - .env
    environment:
      PROJECT_NAME: hello
    ports:
      - "8001:8000"
  todo-web:
    container_name: concierge-todo-web
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "concierge.todo.web_main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
