services:
  concierge:
    container_name: concierge
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "http.server", "8000"]
    env_file:
      - .env
    environment:
      PROJECT_NAME: hello
    ports:
      - "8000:8000"

  postgres:
    container_name: concierge-postgres
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-concierge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concierge}
      POSTGRES_DB: ${POSTGRES_DB:-concierge}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-concierge} -d ${POSTGRES_DB:-concierge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  todo-web:
    container_name: concierge-todo-web
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "concierge.todo.infrastructure.web.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    # Uncomment the lines below to use the local PostgreSQL backend instead of
    # the default in-memory backend.  Run `todo-cli db init` first to create
    # the schema, or set the entrypoint to initialise it automatically.
    # environment:
    #   TODO_REPOSITORY_BACKEND: postgres
    #   POSTGRES_HOST: postgres
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # OpenTelemetry Collector (contrib) that forwards OTLP signals from VS Code
  # GitHub Copilot to Azure Application Insights. Opt-in via the
  # `copilot-otel` profile so it never starts with a plain `docker compose up`.
  #
  # Start:        docker compose --profile copilot-otel up -d otel-collector
  # Stop:         docker compose --profile copilot-otel down
  # Tail logs:    docker compose --profile copilot-otel logs -f otel-collector
  #
  # Requires APPLICATIONINSIGHTS_CONNECTION_STRING in `.env`.
  # See docs/tutorial/appendix-monitor-vscode-copilot.md for the end-to-end walkthrough.
  otel-collector:
    container_name: concierge-otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      # Soft default keeps `docker compose config` (and other-service `up`)
      # working when the variable is unset — only matters when the
      # `copilot-otel` profile is active. When empty, the azuremonitor
      # exporter fails fast at collector startup with a clear log line.
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${COPILOT_OTEL_COLLECTOR_OTLP_HTTP_PORT:-4318}:4318"
      - "${COPILOT_OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}:4317"
    profiles: ["copilot-otel"]

volumes:
  postgres-data:
