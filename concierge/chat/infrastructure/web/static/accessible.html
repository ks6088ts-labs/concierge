<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Concierge アクセシブル音声モード</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --accent: #16a34a;
        --accent-active: #dc2626;
        --muted: #cbd5e1;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        font-size: 22px;
        line-height: 1.7;
        -webkit-tap-highlight-color: transparent;
      }

      /* Full-screen tap target: a single giant button. Tapping anywhere on the
         screen toggles the call (start / stop). It sits behind the text so the
         dialogue is readable; the text layer forwards taps down to it. */
      #tap {
        position: fixed;
        inset: 0;
        z-index: 0;
        border: none;
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      #tap:focus-visible { outline: 4px solid #60a5fa; outline-offset: -8px; }

      /* Text layer, above the tap button but transparent to pointer events so
         every tap reaches #tap. */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
      }

      #status {
        flex-shrink: 0;
        padding: 1rem 0 0.75rem;
        text-align: center;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--muted);
      }
      #status .indicator {
        display: inline-block;
        width: 0.9rem;
        height: 0.9rem;
        border-radius: 50%;
        margin-right: 0.5rem;
        background: #475569;
        vertical-align: middle;
      }
      body.state-connecting #status .indicator { background: #d97706; animation: pulse 1.2s infinite; }
      body.state-active #status .indicator { background: var(--accent-active); animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

      #dialogue {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0.5rem 0;
        list-style: none;
      }
      #dialogue li {
        margin: 0 0 0.9rem;
        padding: 0.6rem 0.8rem;
        border-radius: 12px;
        background: #0f172a;
        border: 1px solid #1e293b;
      }
      #dialogue li.user { background: #082f49; border-color: #0c4a6e; }
      #dialogue li.agent { background: #052e16; border-color: #14532d; }
      #dialogue .who {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 0.15rem;
      }
      #dialogue .text { font-size: 1.15rem; }

      #interim {
        flex-shrink: 0;
        min-height: 2.2rem;
        margin: 0;
        padding: 0.5rem 0.8rem 1rem;
        color: var(--muted);
        font-style: italic;
      }

      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0);
        white-space: nowrap; border: 0;
      }

      /* Hidden helpers for the camera capture pipeline. */
      #camera-video, #camera-canvas { display: none; }
    </style>
  </head>
  <body class="state-idle">
    <!-- Giant single button: tap anywhere to start / stop the call. -->
    <button
      id="tap"
      type="button"
      aria-label="画面のどこでもタップで通話を開始・終了できます"
    ></button>

    <div class="overlay">
      <h1 class="sr-only">Concierge アクセシブル音声モード</h1>
      <p id="status" role="status" aria-live="assertive">
        <span class="indicator" aria-hidden="true"></span><span id="status-text">読み込み中…</span>
      </p>
      <ol id="dialogue" aria-live="polite" aria-label="会話テキスト" aria-atomic="false"></ol>
      <p id="interim" aria-live="polite" aria-atomic="true"></p>
    </div>

    <!-- Off-screen media elements used to grab a camera frame on request. -->
    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="camera-canvas"></canvas>

    <script>
      'use strict';

      const REALTIME_SAMPLE_RATE = 24000;
      const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const TTS_MAX_CHARS = 4000;
      const ttsBrowserSupported =
        typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

      const params = new URLSearchParams(location.search);

      const els = {
        body: document.body,
        tap: document.getElementById('tap'),
        statusText: document.getElementById('status-text'),
        dialogue: document.getElementById('dialogue'),
        interim: document.getElementById('interim'),
        cameraVideo: document.getElementById('camera-video'),
        cameraCanvas: document.getElementById('camera-canvas'),
      };

      const state = {
        userId: null,
        displayName: 'あなた',
        conversationId: null,
        callState: 'idle', // 'idle' | 'connecting' | 'active'
        realtimeSupported: false,
        // When TTS mode is on the browser reads AI text at a slow, adjustable
        // rate and the realtime audio is muted (so speech isn't doubled). Off
        // by default: the realtime voice plays and is slowed via the prompt.
        ttsEnabled: params.get('tts') === '1',
        ttsRate: 0.85,
        seenMessageIds: new Set(),
      };

      const call = {
        ws: null,
        mediaStream: null,
        audioCtx: null,
        workletNode: null,
        playbackCtx: null,
        playbackQueue: [],
        isPlaying: false,
        currentSource: null,
        userSpeaking: false,
        userInterim: '',
        agentInterim: '',
        endingOnPurpose: false,
      };

      const camera = { stream: null };

      const WORKLET_SRC = `
class PCM16Processor extends AudioWorkletProcessor {
  constructor() { super(); this._buf = []; }
  process(inputs) {
    const ch = inputs[0]?.[0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this._buf.push(Math.max(-1, Math.min(1, ch[i])));
      if (this._buf.length >= 4800) {
        const pcm = new Int16Array(this._buf.length);
        for (let j = 0; j < this._buf.length; j++)
          pcm[j] = this._buf[j] < 0 ? this._buf[j] * 32768 : this._buf[j] * 32767;
        this.port.postMessage({ pcm: pcm.buffer }, [pcm.buffer]);
        this._buf = [];
      }
    }
    return true;
  }
}
registerProcessor('pcm16-processor', PCM16Processor);
`;

      // -------- Status / dialogue rendering --------
      function setStatus(text, callState) {
        els.statusText.textContent = text;
        if (callState) {
          state.callState = callState;
          els.body.className = `state-${callState}`;
        }
      }

      function appendDialogue(role, who, text) {
        const li = document.createElement('li');
        li.className = role === 'agent' ? 'agent' : role === 'user' ? 'user' : '';
        const whoEl = document.createElement('span');
        whoEl.className = 'who';
        whoEl.textContent = who;
        const textEl = document.createElement('span');
        textEl.className = 'text';
        textEl.textContent = text;
        li.appendChild(whoEl);
        li.appendChild(textEl);
        els.dialogue.appendChild(li);
        els.dialogue.scrollTop = els.dialogue.scrollHeight;
      }

      function renderInterim() {
        // Show whichever side is currently streaming; the agent's in-progress
        // reply takes priority once it starts.
        let text = '';
        if (call.agentInterim) text = `🤖 ${call.agentInterim}`;
        else if (call.userInterim) text = `🗣️ ${call.userInterim}`;
        els.interim.textContent = text;
      }

      function clearInterim() {
        call.userInterim = '';
        call.agentInterim = '';
        els.interim.textContent = '';
      }

      // -------- Text-to-Speech (optional slow read-aloud) --------
      let currentUtterance = null;
      function pickJaVoice() {
        if (!ttsBrowserSupported) return null;
        const voices = window.speechSynthesis.getVoices();
        return (
          voices.find((v) => typeof v.lang === 'string' && v.lang.toLowerCase().startsWith('ja')) || null
        );
      }
      function stopSpeaking() {
        if (!ttsBrowserSupported) return;
        try { window.speechSynthesis.cancel(); } catch (_) { /* noop */ }
        currentUtterance = null;
      }
      function speakText(text) {
        if (!ttsBrowserSupported || !text) return;
        stopSpeaking();
        const u = new SpeechSynthesisUtterance(String(text).slice(0, TTS_MAX_CHARS));
        u.lang = 'ja-JP';
        u.rate = state.ttsRate;
        const voice = pickJaVoice();
        if (voice) u.voice = voice;
        currentUtterance = u;
        try { window.speechSynthesis.speak(u); } catch (_) { /* noop */ }
      }

      // -------- base64 / audio helpers --------
      function arrayBufferToBase64(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (const b of bytes) bin += String.fromCharCode(b);
        return btoa(bin);
      }

      function ensurePlaybackCtx() {
        if (!call.playbackCtx) call.playbackCtx = new AudioContext({ sampleRate: REALTIME_SAMPLE_RATE });
      }

      function scheduleAudio(b64) {
        // Skip realtime audio entirely in TTS mode (browser reads the text
        // instead) and while the user is barging in on the assistant.
        if (state.ttsEnabled || call.userSpeaking) return;
        ensurePlaybackCtx();
        const raw = atob(b64);
        const buf = new Int16Array(raw.length / 2);
        for (let i = 0; i < buf.length; i++) buf[i] = raw.charCodeAt(i * 2) | (raw.charCodeAt(i * 2 + 1) << 8);
        const float32 = new Float32Array(buf.length);
        for (let i = 0; i < buf.length; i++) float32[i] = buf[i] / 32768;
        const audioBuf = call.playbackCtx.createBuffer(1, float32.length, REALTIME_SAMPLE_RATE);
        audioBuf.getChannelData(0).set(float32);
        call.playbackQueue.push(audioBuf);
        if (!call.isPlaying) drainAudioQueue();
      }

      function drainAudioQueue() {
        if (!call.playbackQueue.length) { call.isPlaying = false; call.currentSource = null; return; }
        call.isPlaying = true;
        const buf = call.playbackQueue.shift();
        const src = call.playbackCtx.createBufferSource();
        src.buffer = buf;
        src.connect(call.playbackCtx.destination);
        src.onended = drainAudioQueue;
        src.start();
        call.currentSource = src;
      }

      function stopPlayback() {
        call.playbackQueue = [];
        if (call.currentSource) {
          try { call.currentSource.onended = null; } catch (_) { /* noop */ }
          try { call.currentSource.stop(); } catch (_) { /* noop */ }
          try { call.currentSource.disconnect(); } catch (_) { /* noop */ }
          call.currentSource = null;
        }
        call.isPlaying = false;
      }

      // -------- Microphone capture --------
      async function startMic() {
        call.audioCtx = new AudioContext({ sampleRate: REALTIME_SAMPLE_RATE });
        const blob = new Blob([WORKLET_SRC], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        await call.audioCtx.audioWorklet.addModule(url);
        URL.revokeObjectURL(url);
        const source = call.audioCtx.createMediaStreamSource(call.mediaStream);
        call.workletNode = new AudioWorkletNode(call.audioCtx, 'pcm16-processor');
        call.workletNode.port.onmessage = (ev) => {
          if (call.ws && call.ws.readyState === WebSocket.OPEN) {
            const b64 = arrayBufferToBase64(ev.data.pcm);
            call.ws.send(JSON.stringify({ type: 'oai-event', payload: { type: 'input_audio_buffer.append', audio: b64 } }));
          }
        };
        source.connect(call.workletNode);
        const silent = call.audioCtx.createGain();
        silent.gain.value = 0;
        call.workletNode.connect(silent);
        silent.connect(call.audioCtx.destination);
      }

      function stopMic() {
        if (call.workletNode) { call.workletNode.disconnect(); call.workletNode = null; }
        if (call.audioCtx) { call.audioCtx.close().catch(() => {}); call.audioCtx = null; }
        if (call.mediaStream) { call.mediaStream.getTracks().forEach((t) => t.stop()); call.mediaStream = null; }
      }

      // -------- Camera (voice-triggered, hands-free) --------
      async function ensureCamera() {
        if (camera.stream) return camera.stream;
        camera.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false,
        });
        els.cameraVideo.srcObject = camera.stream;
        try { await els.cameraVideo.play(); } catch (_) { /* autoplay fallback */ }
        // Give the sensor a brief moment to expose/focus before the first grab.
        await new Promise((r) => setTimeout(r, 600));
        return camera.stream;
      }

      function stopCamera() {
        if (camera.stream) { camera.stream.getTracks().forEach((t) => t.stop()); camera.stream = null; }
        els.cameraVideo.srcObject = null;
      }

      function captureToDataUrl(maxDim = 1024, quality = 0.7) {
        const video = els.cameraVideo;
        const w = video.videoWidth;
        const h = video.videoHeight;
        if (!w || !h) return null;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        const canvas = els.cameraCanvas;
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', quality);
      }

      async function handleCameraCapture(prompt) {
        setStatus('📷 写真を撮影しています…', 'active');
        try {
          await ensureCamera();
          const dataUrl = captureToDataUrl();
          if (!dataUrl) throw new Error('capture produced no frame');
          if (call.ws && call.ws.readyState === WebSocket.OPEN) {
            const msg = { type: 'concierge.image.input', image_url: dataUrl, auto_describe: true };
            if (prompt) msg.prompt = prompt;
            call.ws.send(JSON.stringify(msg));
          }
          setStatus('通話中', 'active');
        } catch (err) {
          console.warn('camera capture failed', err);
          setStatus('カメラを使用できませんでした', 'active');
          // Tell the model so it can inform the user by voice/text.
          if (call.ws && call.ws.readyState === WebSocket.OPEN) {
            call.ws.send(JSON.stringify({
              type: 'oai-event',
              payload: {
                type: 'conversation.item.create',
                item: { type: 'message', role: 'user', content: [{ type: 'input_text', text: 'カメラを使用できませんでした。' }] },
              },
            }));
            call.ws.send(JSON.stringify({ type: 'oai-event', payload: { type: 'response.create' } }));
          }
        }
      }

      // -------- WebSocket message handling --------
      function handleRealtimeMessage(msg) {
        const type = msg.type;
        if (type === 'concierge.session.ready') {
          setStatus('通話中', 'active');
          startMic().catch((e) => {
            console.error('mic error', e);
            setStatus('マイクを起動できませんでした', 'active');
          });
          return;
        }
        if (type === 'concierge.message.persisted') {
          const m = msg.message;
          if (m && !state.seenMessageIds.has(m.id)) {
            state.seenMessageIds.add(m.id);
            const role = (m.role || '').toLowerCase();
            const who = (m.sender && m.sender.display_name) || (role === 'agent' ? 'アシスタント' : 'あなた');
            appendDialogue(role, who, m.content);
            clearInterim();
            if (role === 'agent' && state.ttsEnabled) speakText(m.content);
          }
          return;
        }
        if (type === 'concierge.camera.capture') {
          handleCameraCapture(typeof msg.prompt === 'string' ? msg.prompt : null);
          return;
        }
        if (type === 'concierge.error') {
          setStatus(`エラー: ${msg.detail || ''}`, state.callState);
          return;
        }
        if (type === 'oai-event') {
          const payload = msg.payload || {};
          const evType = payload.type || '';
          if (evType === 'response.output_audio.delta' && payload.delta) {
            scheduleAudio(payload.delta);
          } else if (evType === 'input_audio_buffer.speech_started') {
            call.userSpeaking = true;
            stopPlayback();
            stopSpeaking();
            call.agentInterim = '';
            renderInterim();
          } else if (evType === 'input_audio_buffer.speech_stopped') {
            call.userSpeaking = false;
          } else if (evType === 'conversation.item.input_audio_transcription.delta' && payload.delta) {
            call.userInterim += payload.delta;
            renderInterim();
          } else if (evType === 'conversation.item.input_audio_transcription.completed') {
            call.userInterim = '';
            renderInterim();
          } else if (evType === 'response.output_audio_transcript.delta' && payload.delta) {
            call.agentInterim += payload.delta;
            renderInterim();
          } else if (evType === 'response.output_audio_transcript.done') {
            call.agentInterim = '';
            renderInterim();
          }
        }
      }

      function cleanupCall() {
        stopMic();
        stopPlayback();
        stopSpeaking();
        stopCamera();
        call.ws = null;
        call.userSpeaking = false;
        call.endingOnPurpose = false;
        clearInterim();
      }

      // -------- Call lifecycle --------
      async function startCall() {
        if (state.callState !== 'idle') return;
        if (!state.realtimeSupported) {
          setStatus('音声機能がサーバで無効です', 'idle');
          return;
        }
        if (!state.conversationId) {
          setStatus('会話を準備できませんでした', 'idle');
          return;
        }
        setStatus('接続中…', 'connecting');
        stopSpeaking();
        try {
          call.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setStatus('マイクの使用が許可されていません', 'idle');
          return;
        }
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const wsUrl =
          `${proto}://${location.host}/conversations/${state.conversationId}/realtime` +
          `?user_id=${encodeURIComponent(state.userId)}&mode=accessible`;
        try {
          call.ws = new WebSocket(wsUrl);
        } catch (e) {
          setStatus('接続に失敗しました', 'idle');
          stopMic();
          return;
        }
        call.ws.addEventListener('message', (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch (_) { return; }
          handleRealtimeMessage(msg);
        });
        call.ws.addEventListener('close', () => {
          cleanupCall();
          setStatus('タップして会話を開始', 'idle');
        });
        call.ws.addEventListener('error', () => {
          if (!call.endingOnPurpose) setStatus('接続エラーが発生しました', state.callState);
        });
      }

      function endCall() {
        if (state.callState === 'idle') return;
        call.endingOnPurpose = true;
        if (call.ws && call.ws.readyState === WebSocket.OPEN) {
          try { call.ws.close(1000, 'user ended call'); } catch (_) { /* noop */ }
        }
        cleanupCall();
        setStatus('タップして会話を開始', 'idle');
      }

      function toggleCall() {
        if (state.callState === 'idle') startCall();
        else endCall();
      }

      // -------- Bootstrap --------
      function ensureUserId() {
        let userId = localStorage.getItem('chat_user_id');
        if (!userId || !UUID_RE.test(userId)) {
          userId = crypto.randomUUID();
          localStorage.setItem('chat_user_id', userId);
        }
        state.userId = userId;
        state.displayName = localStorage.getItem('chat_display_name') || 'あなた';
      }

      async function apiJson(path, options = {}) {
        const headers = Object.assign(
          { 'X-User-Id': state.userId, Accept: 'application/json' },
          options.body ? { 'Content-Type': 'application/json' } : {},
          options.headers || {},
        );
        const res = await fetch(path, Object.assign({}, options, { headers }));
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        return res.status === 204 ? null : res.json();
      }

      async function loadConfig() {
        try {
          const cfg = await (await fetch('/accessible/config', { headers: { Accept: 'application/json' } })).json();
          state.realtimeSupported = !!cfg.realtime;
          if (typeof cfg.tts_rate === 'number' && cfg.tts_rate > 0) state.ttsRate = cfg.tts_rate;
        } catch (_) {
          state.realtimeSupported = false;
        }
        // A query override wins so the rate can be tuned per device without a
        // server change: /accessible?rate=0.7
        const rateParam = Number(params.get('rate'));
        if (Number.isFinite(rateParam) && rateParam > 0) state.ttsRate = rateParam;
      }

      async function createConversation() {
        try {
          const title = `アクセシブル会話 ${new Date().toLocaleString('ja-JP')}`;
          const conv = await apiJson('/conversations', {
            method: 'POST',
            body: JSON.stringify({ title, display_name: state.displayName }),
          });
          state.conversationId = conv.id;
        } catch (e) {
          console.error('failed to create conversation', e);
          setStatus('会話を準備できませんでした', 'idle');
        }
      }

      async function init() {
        ensureUserId();
        await loadConfig();
        await createConversation();
        if (!state.realtimeSupported) {
          setStatus('音声機能がサーバで無効です（AZURE_AI_PROJECT_ENDPOINT_REALTIME 未設定）', 'idle');
        } else if (state.conversationId) {
          setStatus('タップして会話を開始', 'idle');
        }
      }

      // Tap / click / keyboard anywhere toggles the call. Debounced so a
      // double-tap doesn't immediately start then stop.
      let lastToggle = 0;
      function onToggleGesture(e) {
        if (e) e.preventDefault();
        const now = Date.now();
        if (now - lastToggle < 400) return;
        lastToggle = now;
        toggleCall();
      }
      els.tap.addEventListener('click', onToggleGesture);
      els.tap.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') onToggleGesture(e);
      });
      window.addEventListener('beforeunload', () => {
        if (call.ws && call.ws.readyState === WebSocket.OPEN) {
          try { call.ws.close(1000, 'page unload'); } catch (_) { /* noop */ }
        }
      });

      init();
    </script>
  </body>
</html>
