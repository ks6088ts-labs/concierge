# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: concierge
site_url: https://ks6088ts-labs.github.io/concierge
repo_url: https://github.com/ks6088ts-labs/concierge
repo_name: ks6088ts-labs/concierge
nav:
  - Home: index.md
  - Development Guide: development.md
  - Hands-on Tutorial:
      - Overview: tutorial/index.md
      - 1. Microsoft Foundry + LangChain: tutorial/01-foundry-langchain.md
      - 2. Observability (Tracing & MLflow): tutorial/02-observability.md
      - 3. PostgreSQL (pgvector) CRUD: tutorial/03-postgres-vector-store.md
      - 4. LangGraph Todo Agent CLI: tutorial/04-langgraph-todo-agent.md
      - 5. MLflow GenAI Evaluation: tutorial/05-mlflow-genai-evaluation.md
      - Appendix - References: tutorial/appendix.md
      - Appendix - Monitor VS Code Copilot (App Insights): tutorial/appendix-monitor-vscode-copilot.md
      - Appendix - Deploy to Azure Container Apps (Terraform): tutorial/appendix-deploy-azure-container-apps.md
  - Todo App (Clean Architecture):
      - Overview: todo/index.md
      - REST API Reference: todo/api.md
      - CLI Reference: todo/cli.md
  - Chat App (Clean Architecture):
      - Overview: chat/index.md
      - REST API Reference: chat/api.md
      - CLI Reference: chat/cli.md
  - Shared Agent Runtime:
      - Overview: agents/index.md
      - CLI Reference: agents/cli.md
  - Cloud Agent App (Clean Architecture):
      - Overview: cloud_agent/index.md
      - REST API Reference: cloud_agent/api.md
      - CLI Reference: cloud_agent/cli.md
  - Knowledge Indexer (pgvector):
      - Overview: knowledge/index.md
      - CLI Reference: knowledge/cli.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
theme:
  name: material
  # https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/#automatic-light-dark-mode
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  language: en
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ks6088ts/
    - icon: fontawesome/brands/github
      link: https://github.com/ks6088ts
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/ks6088ts
  analytics:
    provider: google
    property: G-0ZTKFXVQ5K
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
