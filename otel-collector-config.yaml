# OpenTelemetry Collector (contrib distribution) configuration used by the
# `otel-collector` service in compose.yml.
#
# Forwards OTLP traces / metrics / logs emitted by VS Code GitHub Copilot
# (and other OTLP-compatible agents pointed at this collector) to Azure
# Application Insights via the Azure Monitor exporter.
#
# The connection string is read from the APPLICATIONINSIGHTS_CONNECTION_STRING
# environment variable so that the secret never lands in source control.
# See docs/tutorial/appendix-monitor-vscode-copilot.md for the end-to-end setup.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  azuremonitor:
    connection_string: "${env:APPLICATIONINSIGHTS_CONNECTION_STRING}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [azuremonitor]
    metrics:
      receivers: [otlp]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      exporters: [azuremonitor]
