[project]
name = "concierge"
version = "0.0.1"
description = "Microsoft Foundry and LangChain/LangGraph hands-on examples with observability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-storage-queue>=12.12.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "langchain>=1.2.18",
    "langchain-azure-ai[opentelemetry]>=1.2.3",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.1.10",
    "mlflow>=3.12.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=13",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.6.14",
    "mkdocs-static-i18n>=1.3.0",
]
dev = [
    "coverage>=7.8.0",
    "import-linter>=2.11",
    "jupyterlab>=4.4.2",
    "pre-commit>=4.2.0",
    "pyrefly>=0.44.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.7",
    "testcontainers[postgres]>=4.0",
    "ty>=0.0.1a6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
todo-web = "concierge.todo.infrastructure.web.app:start"
todo-cli = "concierge.todo.infrastructure.cli.app:app"
chat-web = "concierge.chat.infrastructure.web.app:start"
chat-cli = "concierge.chat.infrastructure.cli.app:app"
cloud-agent-web = "concierge.cloud_agent.infrastructure.web.app:start"
cloud-agent-cli = "concierge.cloud_agent.infrastructure.cli.app:app"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["D203"]

[tool.pytest.ini_options]
addopts = "-ra --cov"
testpaths = ["tests"]
pythonpath = ['.']
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
    "integration: marks tests as integration tests that require Docker (deselect with '-m not integration')",
]
filterwarnings = [
    # langgraph 1.1.10 constructs `langchain_core.load.load.Reviver()` without
    # `allowed_objects`, which triggers a pending-deprecation warning from
    # langchain-core >= 1.3.3 at import time. langchain-core registers its own
    # "default" filter for this category on import, so we must target the exact
    # subclass to override it. Remove once langgraph upgrades.
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.coverage.report]
show_missing = true

[tool.ty]
environment = { python-version = "3.10" }

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# ---
# import-linter: Static analysis of dependency direction for clean architecture.
#
# The ``concierge.todo`` and ``concierge.chat`` packages follow a layered
# architecture (infrastructure -> application -> domain). The contracts below
# enforce, at the import level, that:
#
#   * Higher layers may depend on lower layers, never the reverse.
#   * The domain layer is free of framework or IO concerns.
#   * The application layer is free of web/persistence/CLI framework concerns.
#   * The two bounded contexts (``todo`` and ``chat``) stay independent.
#
# Run with ``uv run lint-imports`` (also wired into ``make lint``).
# ---
[tool.importlinter]
root_package = "concierge"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "todo-layers"
name = "concierge.todo follows clean architecture layers"
type = "layers"
layers = [
    "infrastructure",
    "application",
    "domain",
]
containers = ["concierge.todo"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "chat-layers"
name = "concierge.chat follows clean architecture layers"
type = "layers"
layers = [
    "infrastructure",
    "application",
    "domain",
]
containers = ["concierge.chat"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "domain-no-frameworks"
name = "Domain layers do not depend on frameworks or IO libraries"
type = "forbidden"
source_modules = [
    "concierge.todo.domain",
    "concierge.chat.domain",
]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "typer",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "psycopg",
    "azure",
    "langchain",
    "langchain_core",
    "langchain_postgres",
    "langgraph",
    "mlflow",
    "concierge.settings",
    "concierge.loggers",
    "concierge.core",
]

[[tool.importlinter.contracts]]
id = "application-no-frameworks"
name = "Application layers do not depend on web, persistence, or CLI frameworks"
type = "forbidden"
source_modules = [
    "concierge.todo.application",
    "concierge.chat.application",
]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "typer",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "psycopg",
    "azure",
    "websockets",
]

[[tool.importlinter.contracts]]
id = "bounded-contexts-independent"
name = "concierge.todo and concierge.chat are independent bounded contexts"
type = "independence"
modules = [
    "concierge.todo",
    "concierge.chat",
]

[[tool.importlinter.contracts]]
id = "cloud-agent-layers"
name = "concierge.cloud_agent follows clean architecture layers"
type = "layers"
layers = [
    "infrastructure",
    "application",
    "domain",
]
containers = ["concierge.cloud_agent"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "cloud-agent-domain-no-frameworks"
name = "cloud_agent domain layer does not depend on frameworks or IO libraries"
type = "forbidden"
source_modules = [
    "concierge.cloud_agent.domain",
]
forbidden_modules = [
    "fastapi",
    "uvicorn",
    "typer",
    "httpx",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "psycopg",
    "azure",
    "langchain",
    "langchain_core",
    "langchain_postgres",
    "langgraph",
    "mlflow",
    "concierge.settings",
    "concierge.loggers",
    "concierge.core",
]
